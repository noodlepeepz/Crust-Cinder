<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Crust & Cinder</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <h2>Crust & Cinder</h2>
            <span>Artisanal Bakery</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
        <a href="index.html#menu" class="btn-primary">Pre-Order Bakes</a>
    </header>

    <section class="section">
        <h1>Visit & Contact Us</h1>
        <p><strong>Address:</strong> 123 Artisan Way, San Antonio, TX</p>
        <p><strong>Operating Hours:</strong> Tuesday – Sunday: 7:00 AM – 3:00 PM (Or until sold out)</p>
        
        <h2>Catering & General Inquiries</h2>
        <form>
            <div class="form-group">
                <input type="text" placeholder="Your Full Name" required>
            </div>
            <div class="form-group">
                <input type="email" placeholder="Your Email Address" required>
            </div>
            <div class="form-group">
                <textarea rows="5" placeholder="Tell us about your order or inquiry..." required></textarea>
            </div>
            <button type="submit" class="btn-primary">Send Message</button>
        </form>
    </section>

</body>
</html>
